[versions]
agp                 = "8.7.3"
kotlin              = "2.0.21"
coreKtx             = "1.13.1"
appcompat           = "1.7.0"
material            = "1.12.0"
constraintlayout    = "2.1.4"
lifecycle           = "2.8.3"
navigation          = "2.7.7"
recyclerview        = "1.3.2"
viewpager2          = "1.1.0"
swipeRefreshLayout  = "1.1.0"
workManager         = "2.9.1"
securityCrypto      = "1.1.0-alpha06"
coroutines          = "1.9.0"
serialization       = "1.7.3"
supabase            = "3.6.0"
ktor                = "3.0.1"
junit               = "4.13.2"
junitExt            = "1.2.1"
robolectric         = "4.13"
testCore            = "1.6.1"
testRunner          = "1.6.2"

[libraries]
androidx-core-ktx              = { group = "androidx.core",              name = "core-ktx",               version.ref = "coreKtx" }
androidx-appcompat             = { group = "androidx.appcompat",         name = "appcompat",               version.ref = "appcompat" }
material                       = { group = "com.google.android.material", name = "material",                version.ref = "material" }
androidx-constraintlayout      = { group = "androidx.constraintlayout",  name = "constraintlayout",        version.ref = "constraintlayout" }
androidx-recyclerview          = { group = "androidx.recyclerview",       name = "recyclerview",            version.ref = "recyclerview" }
androidx-viewpager2            = { group = "androidx.viewpager2",        name = "viewpager2",              version.ref = "viewpager2" }
androidx-swiperefreshlayout    = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout",      version.ref = "swipeRefreshLayout" }
androidx-work-runtime          = { group = "androidx.work",              name = "work-runtime-ktx",        version.ref = "workManager" }
androidx-security-crypto       = { group = "androidx.security",          name = "security-crypto",         version.ref = "securityCrypto" }

lifecycle-viewmodel-ktx        = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-runtime-ktx          = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",   version.ref = "lifecycle" }

navigation-fragment-ktx        = { group = "androidx.navigation",        name = "navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui-ktx              = { group = "androidx.navigation",        name = "navigation-ui-ktx",       version.ref = "navigation" }

kotlinx-coroutines-android     = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json     = { group = "org.jetbrains.kotlinx",      name = "kotlinx-serialization-json", version.ref = "serialization" }

supabase-bom                   = { group = "io.github.jan-tennert.supabase", name = "bom",              version.ref = "supabase" }
supabase-postgrest             = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
supabase-realtime              = { group = "io.github.jan-tennert.supabase", name = "realtime-kt" }
supabase-auth                  = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-gotrue                = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
ktor-client-cio                = { group = "io.ktor",                    name = "ktor-client-cio",         version.ref = "ktor" }

gridlayout                     = { group = "androidx.gridlayout",       name = "gridlayout",              version = "1.0.0" }

junit                          = { group = "junit",                      name = "junit",                   version.ref = "junit" }
androidx-junit                 = { group = "androidx.test.ext",          name = "junit",                   version.ref = "junitExt" }
robolectric                    = { group = "org.robolectric",            name = "robolectric",             version.ref = "robolectric" }
androidx-test-core             = { group = "androidx.test",              name = "core-ktx",                version.ref = "testCore" }
androidx-test-runner           = { group = "androidx.test",              name = "runner",                  version.ref = "testRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
