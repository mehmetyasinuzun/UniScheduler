# ────────────────────────────────────────────────────────────────────────
# Release — `v*.*.*` tag push'una bağlı otomatik GitHub Release
#
# Akış:
#   1. git tag v1.2.8 + git push origin v1.2.8
#   2. Bu workflow tetiklenir
#   3. Release imzalı APK üretilir (KEYSTORE_BASE64 secret varsa)
#   4. GitHub Release oluşturulur — APK eklenir, commit log'undan
#      otomatik release notes
#
# Secrets (Settings → Secrets and variables → Actions'tan eklenir):
#   KEYSTORE_BASE64       — base64'lenmiş .jks dosyası
#                          (cmd: base64 -w 0 unischeduler-release.jks)
#   KEYSTORE_PASSWORD     — keystore parolası
#   KEY_ALIAS             — key alias (örn. "unischeduler")
#   KEY_PASSWORD          — key parolası
#   SUPABASE_URL          — production Supabase URL
#   SUPABASE_ANON_KEY     — production anon key
#
# Secret'lar yoksa job uyarı verir ama yine de debug imzalı APK üretir
# (test için kullanılabilir, Play Store'a yüklenmez).
# ────────────────────────────────────────────────────────────────────────
name: Release — tagged APK + GitHub Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (e.g., v1.2.8)'
        required: true

jobs:
  release:
    name: Build signed APK + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # Release oluşturmak için

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # changelog için tüm git history

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Secret değerleriyle local.properties üret. Eksik secret = stub değer.
      - name: Materialise local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://stub.supabase.co' }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'stub' }}" >> local.properties

      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > unischeduler-release.jks
          echo "KEYSTORE_FILE=$(pwd)/unischeduler-release.jks" >> local.properties
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> local.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # APK'yı tag'e göre yeniden adlandır — kullanıcı indirirken hangi
      # sürüm olduğunu dosya adından anlasın.
      - name: Rename APK with tag
        id: rename
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then TAG="${{ inputs.tag }}"; fi
          if [ -z "$TAG" ]; then TAG="manual-$(date +%Y%m%d)"; fi
          OUT="UniScheduler-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "apk_path=$OUT" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # Release notes — son tag'den bu tag'e commit'leri otomatik
      - name: Generate changelog
        id: changelog
        run: |
          TAG=${{ steps.rename.outputs.tag }}
          PREV=$(git tag --sort=-version:refname | grep -v "^$TAG$" | head -1 || echo "")
          {
            echo "## Değişiklikler"
            echo ""
            if [ -n "$PREV" ]; then
              git log --pretty=format:"- %s (%h)" "$PREV..HEAD" -- .
            else
              git log --pretty=format:"- %s (%h)" -n 30
            fi
            echo ""
            echo ""
            echo "## Kurulum"
            echo ""
            echo "1. APK'yı telefona kopyala"
            echo "2. Ayarlar → Güvenlik → **Bilinmeyen kaynaklara izin ver**"
            echo "3. APK'ya tıkla → Kur"
            echo ""
            echo "**Not:** Eski sürüm yüklüyse önce kaldırmanız gerekebilir (imza farkı)."
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: UniScheduler ${{ steps.rename.outputs.tag }}
          tag_name: ${{ steps.rename.outputs.tag }}
          body_path: release-notes.md
          files: ${{ steps.rename.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
