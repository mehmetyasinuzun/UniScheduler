# ────────────────────────────────────────────────────────────────────────
# Android — Debug build + unit testler + lint
#
# Tetikleyici:
#   • push'ta (master + diğer dallar)
#   • PR'da (master'a açılan)
#   • manuel "Run workflow" düğmesi
#
# Çıktı:
#   • app-debug.apk  → Actions sayfasında 7 gün artifact olarak indirilebilir
#   • Test raporu     → varsa Actions sayfasında özet
#
# Build NEDEN release değil? Release imza için keystore secret gerekir
# (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Bunlar
# GitHub Secrets'a tanımlanmadan release çıkmaz — pipeline'ı her geliştirici
# için çalışan tutmak için debug. Production APK için ayrı release.yml var.
# ────────────────────────────────────────────────────────────────────────
name: Android — build & test

on:
  push:
    branches: ['**']
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

# Aynı dalda yeni push gelirse eski koşumu iptal et — quota tasarrufu
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (debug) + tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache + wrapper validate)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      # local.properties gitignored — CI'da Supabase placeholder'larıyla
      # üretiyoruz ki gradle.buildConfigField boş string'le derlesin.
      # Gerçek keyler CI üzerinden APK'ya gömülmez (release.yml'de secret).
      - name: Stub local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "SUPABASE_URL=https://stub.supabase.co" >> local.properties
          echo "SUPABASE_ANON_KEY=stub" >> local.properties

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Unit tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore
