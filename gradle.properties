# ── JVM ──────────────────────────────────────────────────────────────────────
# 4 GB heap; POI's xmlbeans + R8's class graph analysis blow past the 2 GB
# default and cause GC thrash on full builds.
org.gradle.jvmargs=-Xmx4096m -Xms512m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# ── Parallelism & caching (the biggest wins) ─────────────────────────────────
# Run independent tasks in parallel across CPU cores.
org.gradle.parallel=true
# Reuse outputs from any matching prior build (across branches/clean).
org.gradle.caching=true
# Configure only the projects required by the requested tasks.
org.gradle.configureondemand=true
# Keep a long-lived JVM around to avoid 5–10s startup on every invocation.
org.gradle.daemon=true

# ── Kotlin ──────────────────────────────────────────────────────────────────
kotlin.code.style=official
# Recompile only changed files instead of the whole module.
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# ── Android ─────────────────────────────────────────────────────────────────
android.useAndroidX=true
# We have no legacy support libraries; Jetifier off shaves ~10–20s.
android.enableJetifier=false
# Smaller R class — only the resources actually referenced.
android.nonTransitiveRClass=true
# Skip BuildConfig generation for libraries that don't need it.
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false
